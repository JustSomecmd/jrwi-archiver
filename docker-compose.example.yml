# Add this service to the compose file that runs TubeArchivist and Jellyfin.
services:
  jrwi-archiver:
    image: ghcr.io/justsomecmd/jrwi-archiver:latest
    container_name: jrwi-archiver
    restart: unless-stopped
    # Run as your own user so Jellyfin and you can read the files (find the numbers with `id`).
    user: "1000:1000"
    ports:
      - "8090:8090"
    environment:
      - TZ=Europe/Amsterdam
      # Optional. Without these, set the jrwishow.com login on the admin page instead.
      # - JRWI_EMAIL=you@example.com
      # - JRWI_PASSWORD=your-password
      # Optional. Without it, the web app asks you to choose a password on first visit.
      # - JRWI_WEB_PASSWORD=choose-a-password
    volumes:
      - ./jrwi/data:/data          # database, login session
      - ./jrwi/archive:/archive    # posts, audio, images, attachments, comments, site pages
      - /srv/media/jrwi:/media/jrwi  # video, laid out as TV shows for Jellyfin

  # In your existing Jellyfin service, mount the same video folder (read-only is enough)
  # and add it in Jellyfin as a "Shows" library:
  #
  # jellyfin:
  #   volumes:
  #     - /srv/media/jrwi:/media/jrwi:ro
