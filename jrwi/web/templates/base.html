<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}JRWI archive{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css?v={{ version }}">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">{% if logo %}<img src="{{ logo }}" alt="">{% endif %}<span>JRWI archive</span></a>
    <nav>
      <a href="/" {% if active == 'home' %}class="on"{% endif %}>Home</a>
      <a href="/feed" {% if active == 'feed' %}class="on"{% endif %}>Feed</a>
      <a href="/pages" {% if active == 'pages' %}class="on"{% endif %}>Pages</a>
      <a href="/admin" {% if active == 'admin' %}class="on"{% endif %}>Admin</a>
      <a href="/admin/settings" {% if active == 'settings' %}class="on"{% endif %}>Settings</a>
    </nav>
    {% if status.running %}<span class="run"><span class="dot"></span>{{ status.phase }}</span>{% endif %}
    <a class="small muted logout" href="/logout">Log out</a>
  </div>
</header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
<script src="/static/app.js?v={{ version }}"></script>
</body>
</html>
